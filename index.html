<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CHARUSAT Identity Card</title>

  <link rel="icon" type="image/png" href="logo-top.png  ">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    img {
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    body {
      background: #e6e6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .id-card {
      width: 340px;
      height: 560px;
      background: #ffffff;
      border-radius: 14px;
      border: 6px solid #1f5fa3;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.50);
      overflow: hidden;
      position: relative;
    }

    /* HEADER */
    .card-header {
      text-align: center;
      padding: 12px;
      border-bottom: 2px solid #1f5fa3;
    }

    .card-header img {
      width: 50px;
    }

    .card-header h2 {
      margin: 5px 0 2px;
      font-size: 22px;
      color: #1f5fa3;
      letter-spacing: 1px;
    }

    .card-header p {
      margin: 0;
      font-size: 10px;
      color: #555;
    }

    /* INSTITUTE */
    .institute {
      text-align: center;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #1f5fa3;
    }

    /* PHOTO */
    .photo-box {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .photo-box img {
      width: 120px;
      height: 140px;
      object-fit: cover;
      border: 3px solid #1f5fa3;
      border-radius: 6px;
    }

    /* INFO */
    .student-info {
      text-align: center;
      margin-top: 15px;
    }

    .student-info h3 {
      margin: 5px 0;
      font-size: 18px;
    }

    .student-info p {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
    }

    /* QR CODE */
    .qr-section {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    #qrcode {
      padding: 6px;
      border: 2px solid #1f5fa3;
      border-radius: 6px;
    }

    /* SIGNATURE */
    .signature {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-top: 10px;
    }

    .signature img {
      width: 80px;
    }

    .signature p {
      font-size: 12px;
      font-weight: bold;
    }

    /* FOOTER */
    .footer-design {
      position: absolute;
      bottom: 0;
      width: 340px;
      height: 10px;
      background: linear-gradient(135deg, #1f5fa3 50%, #e2a16d 50%);
    }

    /* ===========================
   MOBILE FULL SCREEN SUPPORT
=========================== */

@media (max-width: 768px) {

  body {
    margin: 0;
    height: 100vh;
    align-items: stretch;
  }

  .id-card {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border-width: 4px;
    box-shadow: none;
  }

  .card-header h2 {
    font-size: 26px;
  }

  .institute {
    font-size: 16px;
  }

  .photo-box img {
    width: 150px;
    height: 180px;
  }

  .student-info h3 {
    font-size: 22px;
  }

  .student-info p {
    font-size: 18px;
  }

  #qrcode img {
    width: 120px !important;
    height: 120px !important;
  }

  .signature p {
    font-size: 14px;
  }

  .footer-design {
    width: 100vw;
  }
}

  </style>
</head>

<body>

  <div class="id-card">

    <div class="card-header">
      <h2><img src="Logo.png" alt="University Logo"> CHARUSAT</h2>
      <p>Charotar University of Science and Technology</p>
    </div>

    <div class="institute">
      SMT. CHANDABEN MOHANBHAI PATEL<br>
      INSTITUTE OF COMPUTER APPLICATIONS (CMPICA)
    </div>

    <div class="photo-box">
      <img src="my.png" alt="Student Photo">
    </div>

    <div class="student-info">
      <h3>Soni Nihar Chetankumar</h3>
      <p>Student ID : 25MSIT174</p>
    </div>

    <!-- REAL QR CODE -->
    <div class="qr-section">
      <div id="qrcode"></div>
    </div>
<!--
    <div class="signature">
      <img src="https://via.placeholder.com/80x30?text=Sign">
      <p>Registrar</p>
    </div>
-->
    <div class="footer-design"></div>

  </div>

  <script>
    // REAL QR CODE → Opens same site
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 90,
      height: 90
    });
  </script>

  <!-- Protection and security script -->
  <script>
    /* ===============================
       BASIC INTERACTION BLOCKS
    ================================ */

    // Disable right click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Disable text selection
    document.addEventListener('selectstart', e => e.preventDefault());

    // Disable drag (image save)
    document.addEventListener('dragstart', e => e.preventDefault());

    // Disable double click
    document.addEventListener('dblclick', e => e.preventDefault());

    /* ===============================
       KEYBOARD SHORTCUT BLOCKS
    ================================ */
    document.addEventListener('keydown', function (e) {

      // F12
      if (e.key === "F12") {
        e.preventDefault();
      }

      // Ctrl + Shift + I / J / C
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) {
        e.preventDefault();
      }

      // Ctrl + U (View Source)
      if (e.ctrlKey && e.key === 'u') {
        e.preventDefault();
      }

      // Ctrl + S (Save page)
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
      }

      // Ctrl + P (Print)
      if (e.ctrlKey && e.key === 'p') {
        e.preventDefault();
      }
    });

    /* ===============================
       MOBILE LONG PRESS BLOCK
    ================================ */
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchend', function (e) {
      e.preventDefault();
    }, { passive: false });

    /* ===============================
       DEVTOOLS DETECTION
    ================================ */
    setInterval(() => {
      const threshold = 160;
      if (
        window.outerWidth - window.innerWidth > threshold ||
        window.outerHeight - window.innerHeight > threshold
      ) {
        document.body.innerHTML = `
      <div style="
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:Arial;
        background:#000;
        color:#fff;
        font-size:20px;
      ">
        ⚠ Access Blocked
      </div>`;
      }
    }, 1000);

    /* ===============================
       SCREENSHOT DETECTION (PARTIAL)
       Blanks screen when visibility changes
    ================================ */
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        document.body.style.filter = "blur(10px)";
      } else {
        document.body.style.filter = "none";
      }
    });

    /* ===============================
       IMAGE PROTECTION
    ================================ */
    document.querySelectorAll("img").forEach(img => {
      img.setAttribute("draggable", "false");
      img.style.pointerEvents = "none";
    });
  </script>

</body>

</html>
